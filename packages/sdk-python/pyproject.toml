[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wayscribe"
version = "0.2.0"
description = "Native Python recorder for Wayscribe record-level debugging"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jorge Polanco"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://wayscribe.dev"
Source = "https://gitlab.com/jojithedev/wayscribe"
Documentation = "https://gitlab.com/jojithedev/wayscribe/-/blob/main/packages/sdk-python/README.md"
Changelog = "https://gitlab.com/jojithedev/wayscribe/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.com/jojithedev/wayscribe/-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wayscribe = ["py.typed"]
