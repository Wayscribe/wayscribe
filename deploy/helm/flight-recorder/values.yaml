# Values are named after the environment variables they set, so the mapping
# between this chart and infrastructure/compose.published.yaml stays mechanical
# rather than remembered. Two deployment shapes exist; a variable added to one
# has to reach the other.

image:
  registry: registry.gitlab.com/jojithedev/flight-recorder
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # For a private registry. Empty on a local cluster that loaded images directly.
  pullSecrets: []

# Flight Recorder keeps everything in one PostgreSQL database and expects you to
# bring your own — the one that is already backed up and monitored (ADR-037).
#
# Either set `databaseUrl`, or point `existingSecret` at a secret you manage, or
# turn on `postgresql` below for evaluation.
databaseUrl: ""

secrets:
  # Generate: openssl rand -hex 32
  encryptionKey: ""
  # Only while rotating encryptionKey: the key being replaced, so data written
  # under it stays readable until it is re-encrypted. Leave empty otherwise.
  encryptionKeyPrevious: ""
  adminToken: ""
  # A secret you manage yourself, with keys DATABASE_URL, ENCRYPTION_KEY and
  # ADMIN_TOKEN, and ENCRYPTION_KEY_PREVIOUS during a rotation. Set this and the
  # values above are ignored.
  existingSecret: ""

api:
  replicaCount: 1
  logLevel: info
  defaultRetentionDays: 7
  maxEventPayloadBytes: 262144
  allowFullPayloadCapture: false
  # REPLAY_ALLOWED_HOSTS: the hosts replay may send to, and the control that
  # keeps replay from being a request forgery tool. Set the few development
  # hosts you replay to. `localhost` is the API pod itself (docs/OPERATIONS.md §9).
  replayAllowedHosts: "localhost"
  # DATABASE_STATEMENT_TIMEOUT_MS: every statement the API runs is cancelled
  # after this long and answered 503 query_timeout. 0 disables it.
  databaseStatementTimeoutMs: 15000
  # METRICS_PORT: empty means no metrics listener. When set, the pod serves
  # Prometheus metrics at /metrics on this port as a container port named
  # `metrics`. The Service and the ingress never carry it; scrape the pods
  # (docs/OPERATIONS.md §13).
  metricsPort: ""
  # TRUSTED_PROXY_COUNT: how many reverse proxies in front of the API append to
  # X-Forwarded-For. 0 keys the admin authentication throttle on the socket
  # address. Behind an ingress controller that is the controller's pod, so set
  # it to the number of proxies, and only if nothing reaches the pods directly
  # (docs/OPERATIONS.md §9).
  trustedProxyCount: 0
  service:
    type: ClusterIP
    port: 8080
  resources: {}

web:
  replicaCount: 1
  # TRUSTED_PROXY_COUNT for the login limiter, as api.trustedProxyCount.
  trustedProxyCount: 0
  service:
    type: ClusterIP
    port: 3000
  resources: {}

# Security contexts for the API, web and migrate pods.
#
# The images run as the `node` user (uid and gid 1000) from node:24-alpine, and
# nothing they execute writes to the image: the root filesystem is mounted
# read-only, with an emptyDir at /tmp for all three and at the Next.js cache
# directory for the web pod. How that was checked is in deploy/helm/README.md.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Optional NetworkPolicies, off by default: a policy is only enforced by a CNI
# that supports it, and one that silently does nothing reads as protection.
#
# When on, the API and web pods accept traffic only on their HTTP ports (and the
# API's metrics port when set), the web pod reaches only the API and DNS, and the
# API and migrate pods reach only DNS and the database. Replay sends requests to
# the hosts in api.replayAllowedHosts, so a cluster that replays needs those
# destinations in `apiExtraEgress`, or replays fail to connect.
networkPolicy:
  enabled: false
  # Peers allowed to reach the API and web HTTP ports. Empty allows every
  # source, which an ingress controller and in-cluster SDK clients both need.
  # When set, the API also always admits this release's web pod, which calls it
  # server-side for every page; list your SDK clients' pods or namespaces here
  # too, or their events are refused. Readiness probes come from the kubelet on
  # the node; check your CNI allows them before narrowing this.
  ingressFrom: []
  # Where the database is, for egress from the API and migrate pods. Ignored
  # when postgresql.enabled, which selects the in-cluster pod instead. An empty
  # `to` allows the port to any destination.
  database:
    port: 5432
    to: []
    # - ipBlock:
    #     cidr: 10.0.12.0/24
  # Extra egress rules for the API pod, such as replay destinations.
  apiExtraEgress: []
  # - to:
  #     - ipBlock:
  #         cidr: 192.168.1.0/24
  #   ports:
  #     - port: 8081
  #       protocol: TCP

# Applied before install and before upgrade, mirroring the `migrate` service in
# Compose so there is one answer to who applies schema. Turn it off if your team
# runs migrations through its own process.
migrations:
  enabled: true

# An in-cluster PostgreSQL, for trying this without standing a database up
# first. Off by default, deliberately: ADR-037 makes the operator's own database
# the expected one, and a database inside the chart is invisible to whoever is
# responsible for the data.
postgresql:
  enabled: false
  image: postgres:17-alpine
  user: flight
  password: flight
  database: flight
  storage: 2Gi
  # Empty uses the cluster default, which is what a local cluster wants.
  storageClass: ""
  # The postgres image's own user is uid and gid 70. Started as that user
  # rather than as root, the entrypoint skips its chown and privilege drop,
  # which is why the data volume needs fsGroup to be writable. Its socket
  # directory and /tmp are emptyDirs so the root filesystem can be read-only.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    # Change the volume's ownership only when its root does not already match,
    # rather than walking every file of the data directory on each start.
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# Off. A local cluster reaches the interface with `kubectl port-forward`, and a
# chart that assumes an ingress controller fails on the machine it was written
# for. Structured so a managed cluster is a values file rather than a rewrite.
ingress:
  enabled: false
  className: ""
  host: flight-recorder.local
  annotations: {}
  tls: []
