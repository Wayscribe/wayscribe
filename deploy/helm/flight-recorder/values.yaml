# Values are named after the environment variables they set, so the mapping
# between this chart and infrastructure/compose.published.yaml stays mechanical
# rather than remembered. Two deployment shapes exist; a variable added to one
# has to reach the other.

image:
  registry: registry.gitlab.com/jojithedev/flight-recorder
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # For a private registry. Empty on a local cluster that loaded images directly.
  pullSecrets: []

# Flight Recorder keeps everything in one PostgreSQL database and expects you to
# bring your own — the one that is already backed up and monitored (ADR-037).
#
# Either set `databaseUrl`, or point `existingSecret` at a secret you manage, or
# turn on `postgresql` below for evaluation.
databaseUrl: ""

secrets:
  # Generate: openssl rand -hex 32
  encryptionKey: ""
  # Only while rotating encryptionKey: the key being replaced, so data written
  # under it stays readable until it is re-encrypted. Leave empty otherwise.
  encryptionKeyPrevious: ""
  adminToken: ""
  # A secret you manage yourself, with keys DATABASE_URL, ENCRYPTION_KEY and
  # ADMIN_TOKEN, and ENCRYPTION_KEY_PREVIOUS during a rotation. Set this and the
  # values above are ignored.
  existingSecret: ""

api:
  replicaCount: 1
  logLevel: info
  defaultRetentionDays: 7
  maxEventPayloadBytes: 262144
  allowFullPayloadCapture: false
  replayAllowedHosts: "localhost,host.docker.internal"
  # DATABASE_STATEMENT_TIMEOUT_MS: every statement the API runs is cancelled
  # after this long and answered 503 query_timeout. 0 disables it.
  databaseStatementTimeoutMs: 15000
  # METRICS_PORT: empty means no metrics listener. When set, the pod serves
  # Prometheus metrics at /metrics on this port as a container port named
  # `metrics`. The Service and the ingress never carry it; scrape the pods
  # (docs/OPERATIONS.md §13).
  metricsPort: ""
  # TRUSTED_PROXY_COUNT: how many reverse proxies in front of the API append to
  # X-Forwarded-For. 0 keys the admin authentication throttle on the socket
  # address. Behind an ingress controller that is the controller's pod, so set
  # it to the number of proxies, and only if nothing reaches the pods directly
  # (docs/OPERATIONS.md §9).
  trustedProxyCount: 0
  service:
    type: ClusterIP
    port: 8080
  resources: {}

web:
  replicaCount: 1
  # TRUSTED_PROXY_COUNT for the login limiter, as api.trustedProxyCount.
  trustedProxyCount: 0
  service:
    type: ClusterIP
    port: 3000
  resources: {}

# Applied before install and before upgrade, mirroring the `migrate` service in
# Compose so there is one answer to who applies schema. Turn it off if your team
# runs migrations through its own process.
migrations:
  enabled: true

# An in-cluster PostgreSQL, for trying this without standing a database up
# first. Off by default, deliberately: ADR-037 makes the operator's own database
# the expected one, and a database inside the chart is invisible to whoever is
# responsible for the data.
postgresql:
  enabled: false
  image: postgres:17-alpine
  user: flight
  password: flight
  database: flight
  storage: 2Gi
  # Empty uses the cluster default, which is what a local cluster wants.
  storageClass: ""

# Off. A local cluster reaches the interface with `kubectl port-forward`, and a
# chart that assumes an ingress controller fails on the machine it was written
# for. Structured so a managed cluster is a values file rather than a rewrite.
ingress:
  enabled: false
  className: ""
  host: flight-recorder.local
  annotations: {}
  tls: []
