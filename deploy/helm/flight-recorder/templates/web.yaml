apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flight-recorder.fullname" . }}-web
  labels:
    {{- include "flight-recorder.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flight-recorder.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "flight-recorder.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      containers:
        - name: web
          image: {{ include "flight-recorder.image" (dict "Values" .Values "Chart" .Chart "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Next.js writes its fetch and image cache under .next/cache, which the
          # image does not ship and a read-only root cannot create.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-side only: the browser never contacts the API directly, so
            # this is the in-cluster service rather than anything reachable from
            # outside.
            - name: API_URL
              value: "http://{{ include "flight-recorder.fullname" . }}-api:{{ .Values.api.service.port }}"
            # Must match the API's. The web app derives its session signing key
            # from this, so a mismatch invalidates every session silently.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flight-recorder.secretName" . }}
                  key: ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flight-recorder.fullname" . }}-web
  labels:
    {{- include "flight-recorder.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "flight-recorder.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
