{{- if not .Values.secrets.existingSecret }}
{{- $database := include "flight-recorder.databaseUrl" . }}
{{- if not $database }}
{{- fail "Set databaseUrl to your PostgreSQL, or set postgresql.enabled=true to run one in the cluster. Flight Recorder brings no database of its own (ADR-037)." }}
{{- end }}
{{- if not .Values.secrets.encryptionKey }}
{{- fail "Set secrets.encryptionKey. Generate one with: openssl rand -hex 32. Rotating it later is destructive — see docs/OPERATIONS.md." }}
{{- end }}
{{- if not .Values.secrets.adminToken }}
{{- fail "Set secrets.adminToken. Generate one with: openssl rand -hex 32." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flight-recorder.fullname" . }}-secrets
  labels:
    {{- include "flight-recorder.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $database | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
{{- end }}
