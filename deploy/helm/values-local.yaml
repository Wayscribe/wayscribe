# A local single-node cluster — kind, k3s, or Docker Desktop.
#
#   kind create cluster --name flight-recorder
#   docker compose -f infrastructure/compose.yaml build api web
#   docker tag flight-recorder-api:latest flight-recorder/api:local
#   docker tag flight-recorder-web:latest flight-recorder/web:local
#   kind load docker-image flight-recorder/api:local flight-recorder/web:local --name flight-recorder
#
#   helm install fr deploy/helm/flight-recorder -f deploy/helm/values-local.yaml \
#     --set secrets.encryptionKey=$(openssl rand -hex 32) \
#     --set secrets.adminToken=$(openssl rand -hex 32)
#
#   kubectl port-forward svc/fr-flight-recorder-web 3000:3000
#
# The secrets are not in this file on purpose. A values file with real keys in
# it is a file somebody commits.

image:
  registry: flight-recorder
  tag: local
  # Never: the images were loaded into the cluster directly and do not exist in
  # any registry. Without this, kubelet tries to pull and the pod sits in
  # ImagePullBackOff looking like a broken chart.
  pullPolicy: Never

# Evaluation database, in-cluster. A real installation points databaseUrl at the
# one the team already runs (ADR-037).
postgresql:
  enabled: true
  storage: 1Gi

api:
  logLevel: debug
  # host.docker.internal reaches the host from inside a kind node, which is
  # where a service being debugged usually runs.
  replayAllowedHosts: "localhost,host.docker.internal"
