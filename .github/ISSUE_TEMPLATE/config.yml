# Only read by GitHub. GitLab ignores this file.
#
# Issues should be disabled outright in this mirror's settings. This exists as a
# second line of defence: if they are ever enabled by accident, nobody gets to
# file into a tracker nobody reads.
blank_issues_enabled: false

contact_links:
  - name: Ask a question
    url: https://gitlab.com/jojithedev/wayscribe/-/issues/new?issuable_template=question
    about: Setup and usage help belong on GitLab. Support is best effort.

  - name: Report a bug
    url: https://gitlab.com/jojithedev/wayscribe/-/issues/new?issuable_template=bug
    about: This GitHub repository is a read-only mirror. Bugs are tracked on GitLab.

  - name: Request a feature
    url: https://gitlab.com/jojithedev/wayscribe/-/issues/new?issuable_template=feature
    about: Ideas and feature requests belong on GitLab, where development happens.

  - name: Report a security vulnerability
    url: https://gitlab.com/jojithedev/wayscribe/-/blob/main/SECURITY.md
    about: Please report privately rather than in any public tracker.

  - name: Read the documentation
    url: https://gitlab.com/jojithedev/wayscribe#readme
    about: Setup, operations, architecture, and the decision log.

  - name: Report a conduct concern
    url: https://gitlab.com/jojithedev/wayscribe/-/blob/main/CODE_OF_CONDUCT.md
    about: Report privately to the maintainer using the Code of Conduct contact.
