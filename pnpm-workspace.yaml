packages:
  - "apps/*"
  - "packages/*"

# Build scripts are denied by default in pnpm 11; each must be decided explicitly.
#
#   esbuild     — Vitest's bundler. Its postinstall fetches the platform binary,
#                 so it must run.
#   cpu-features
#   ssh2        — pulled in by dockerode via Testcontainers. Both native builds are
#   protobufjs    optional; Testcontainers talks to Docker over the local socket and
#                 works without them. Denied to keep installs lean and to avoid
#                 running compilers we do not need.
#   sharp       — Next.js image optimization. Its postinstall fetches the platform
#                 binary, and Next requires it for next/image in production.
allowBuilds:
  esbuild: true
  sharp: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Transitive advisories that the direct dependency has not yet picked up.
# `pnpm audit --audit-level=high` gates the pipeline, so these are pinned
# forward rather than allowlisted — an allowlist hides the finding, an override
# removes it. Drop each entry once the parent ships a version that resolves it.
overrides:
  # GHSA-r28c-9q8g-f849 and one other: arbitrary file read via sourceMappingURL.
  # Reached through next.
  postcss@<8.5.18: ">=8.5.18"
  # CVE-2026-333xx in libvips, inherited by sharp. Reached through next.
  sharp@<0.35.0: ">=0.35.0"
