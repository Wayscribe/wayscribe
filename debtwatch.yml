version: 1

# Tracked with DebtWatch — https://gitlab.com/jojithedev/debtwatch
#
# Deliberate shortcuts in this repository are declared where the shortcut lives,
# with an owner and a date. The decision log records *why* something was
# deferred; this records *until when*, which is the part that otherwise never
# gets revisited. An ADR does not expire.

policy:
  require_owner: true
  require_expiration: true
  require_reason: true
  warn_before_days: 30

ci:
  fail_on:
    # A malformed declaration is a broken promise: it silently stops tracking
    # the thing it claims to track.
    invalid_declaration: true
    # Overdue debt does not break the build. It is a conversation, not an
    # outage, and a red pipeline for a date passing trains people to ignore it.
    existing_overdue: false

scan:
  include:
    - "apps/*/src/**"
    # Next.js keeps routes in app/, not src/ — the default template misses them.
    - "apps/*/app/**"
    - "packages/*/src/**"
    - "packages/database/migrations/**"
    - "infrastructure/**"
    - "examples/*/*.mjs"
  exclude:
    - "node_modules/**"
    - "**/node_modules/**"
    - "dist/**"
    - "**/dist/**"
    - "**/.next/**"
    # Generated by Next on every build.
    - "**/next-env.d.ts"
  undeclared_markers: ["TODO", "FIXME", "HACK", "XXX"]
