default:
  image: node:24-alpine
  before_script:
    - corepack enable
    # GitLab can only cache paths inside the project directory, so the pnpm store
    # lives there. Every tool that walks the tree must therefore ignore it — see
    # .prettierignore, eslint.config.js, and .gitignore. Prettier will otherwise
    # try to parse the content-addressed store and fail.
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  # Not PNPM_HOME: that is the global binary directory, not the content store.
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

stages:
  - verify
  - test
  - integration
  - build
  - browser
  - demo
  - mirror
  - release

format:
  stage: verify
  script:
    - pnpm format:check

lint:
  stage: verify
  script:
    - pnpm lint

typecheck:
  stage: verify
  script:
    - pnpm typecheck

unit:
  stage: test
  script:
    - pnpm test

database:
  stage: integration
  # Full node image, not Alpine: Testcontainers needs a Docker client, and this
  # job talks to a docker-in-docker service.
  image: node:24
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - pnpm test:integration

build:
  stage: build
  script:
    - pnpm build

# Browser coverage. TESTING_STRATEGY.md section 8 puts these on protected branches
# or the release workflow rather than every push, and this job builds and boots two
# applications — a red pipeline on every commit for a suite needing the whole stack
# trains people to ignore it.
#
# The image tag must track the @playwright/test version in package.json; a mismatch
# between the browser image and the client is a common and confusing failure.
e2e:
  stage: browser
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: flight
    POSTGRES_PASSWORD: flight
    POSTGRES_DB: flight
    DATABASE_URL: postgresql://flight:flight@postgres:5432/flight
    ENCRYPTION_KEY: ci-encryption-key-00000000000000000
    ADMIN_TOKEN: ci-admin-token-0000000000000000000
    API_URL: http://localhost:8080
  when: manual
  allow_failure: true
  script:
    - pnpm db:migrate
    - pnpm build
    - node apps/api/dist/server.js &
    - pnpm --filter @flight-recorder/web start &
    - npx wait-on http://localhost:8080/health http://localhost:3000/login
    - export FLIGHT_API_KEY=$(pnpm db:seed | grep -oE 'fr_[A-Za-z0-9_-]+' | tail -1)
    - pnpm test:e2e

# The demo is the product acceptance test (DEMO_SCENARIO.md section 1). It needs
# Docker Compose rather than a process, and it builds and boots eight containers,
# so it runs manually for the same reason the browser job does: a red pipeline on
# every push for a suite needing the whole stack trains people to ignore it.
demo:
  stage: demo
  image: docker:27-cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Ports are published by containers under the dind daemon, so they are
    # reachable at the `docker` host rather than at localhost. See
    # infrastructure/compose.ci.yaml.
    FLIGHT_API_URL: http://docker:8080
    DEMO_SOURCE_URL: http://docker:3100
  before_script:
    - apk add --no-cache nodejs npm
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  when: manual
  allow_failure: true
  script:
    - >-
      docker compose -f infrastructure/compose.yaml
      -f infrastructure/compose.demo.yaml
      -f infrastructure/compose.ci.yaml up --build -d
    - npx wait-on "$FLIGHT_API_URL/health" "$DEMO_SOURCE_URL/health"
    - pnpm test:demo
  after_script:
    - >-
      docker compose -f infrastructure/compose.yaml
      -f infrastructure/compose.demo.yaml
      -f infrastructure/compose.ci.yaml down -v

# Everything below runs only on a tag. A release is the one moment the suites
# that need the whole stack are worth waiting for, so the browser and demo jobs
# above are joined here by publishing that is deliberately manual: pushing an
# image and publishing a package are outward-facing acts, and a pipeline should
# not perform them because a tag was pushed by accident.

.release-rules: &release-rules
  rules:
    - if: $CI_COMMIT_TAG

# The gate. Both acceptance suites, unskippable, before anything is published.
release-verify:
  stage: release
  image: docker:27-cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    FLIGHT_API_URL: http://docker:8080
    DEMO_SOURCE_URL: http://docker:3100
  before_script:
    - apk add --no-cache nodejs npm
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  <<: *release-rules
  script:
    - >-
      docker compose -f infrastructure/compose.yaml
      -f infrastructure/compose.demo.yaml
      -f infrastructure/compose.ci.yaml up --build -d
    - npx wait-on "$FLIGHT_API_URL/health" "$DEMO_SOURCE_URL/health"
    - pnpm test:demo
  after_script:
    - >-
      docker compose -f infrastructure/compose.yaml
      -f infrastructure/compose.demo.yaml
      -f infrastructure/compose.ci.yaml down -v

publish-images:
  stage: release
  image: docker:27-cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["release-verify"]
  <<: *release-rules
  when: manual
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # buildx for multi-arch: the images are built on x86 runners and a great
    # many developers are on arm64 laptops.
    - docker buildx create --use --name flight-builder
  script:
    - >-
      docker buildx build --platform linux/amd64,linux/arm64 --push
      -f apps/api/Dockerfile
      -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG"
      -t "$CI_REGISTRY_IMAGE/api:latest" .
    - >-
      docker buildx build --platform linux/amd64,linux/arm64 --push
      -f apps/web/Dockerfile
      -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG"
      -t "$CI_REGISTRY_IMAGE/web:latest" .

# Requires NPM_TOKEN in the project's CI/CD variables, and somebody must own the
# @flight-recorder scope on npm. The dry run below needs neither, so the job
# proves the tarball is correct even before the scope exists.
publish-sdk:
  stage: release
  needs: ["release-verify"]
  <<: *release-rules
  when: manual
  script:
    - pnpm --filter @flight-recorder/node build
    - pnpm --filter @flight-recorder/node publish --dry-run --no-git-checks
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "NPM_TOKEN is not set. The dry run above passed; set the variable to publish for real."
        exit 1
      fi
    - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
    - pnpm --filter @flight-recorder/node publish --no-git-checks

# The GitHub mirror.
#
# GitLab is canonical: every push and every pipeline happens here. GitHub gets a
# read-only copy, and only once the automated suites have passed — which is why
# this is a job rather than GitLab's built-in repository mirroring. Built-in
# mirroring fires on push and knows nothing about pipelines, so it would happily
# publish a red commit.
#
# Both jobs disappear entirely until GITHUB_TOKEN is configured, so this costs
# nothing before the mirror exists. See docs/MIRRORING.md for the one-time setup.

.mirror-rules: &mirror-rules
  rules:
    # Not configured yet: the job does not exist rather than failing every
    # pipeline on main until someone sets it up.
    - if: '$GITHUB_TOKEN == null || $GITHUB_TOKEN == ""'
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

mirror-to-github:
  stage: mirror
  image: alpine:3
  variables:
    # GitLab CI clones shallow by default. Pushing that produces a mirror with
    # twenty commits of history, which looks fine until somebody runs git log.
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  <<: *mirror-rules
  # Network hiccups should not turn main red; a real failure still will.
  retry: 1
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
    # Force, because GitHub is strictly downstream. Anything committed there is
    # overwritten — which is exactly what .github/PULL_REQUEST_TEMPLATE.md warns
    # contributors about.
    - git push --force github "HEAD:refs/heads/main"
    - git push --force --tags github

# GitHub Releases are one of the few real discovery surfaces a mirror buys you:
# they feed watchers, notifications, and third-party release trackers.
github-release:
  stage: mirror
  image: alpine:3
  needs: ["mirror-to-github"]
  before_script:
    - apk add --no-cache curl jq
  rules:
    - if: '$GITHUB_TOKEN == null || $GITHUB_TOKEN == ""'
      when: never
    - if: $CI_COMMIT_TAG
  script:
    # The matching CHANGELOG section, when there is one. A release whose notes
    # read "see the changelog" is a release nobody reads.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      NOTES=$(awk -v v="$VERSION" '
        $0 ~ "^## \\[?" v "\\]?" { flag = 1; next }
        /^## / { flag = 0 }
        flag { print }
      ' CHANGELOG.md)
      [ -z "$NOTES" ] && NOTES="See CHANGELOG.md for what changed in this release."
      NOTES="${NOTES}"$'\n\n'"---"$'\n'"Development happens on GitLab: ${CI_PROJECT_URL} — this GitHub repository is a read-only mirror."
      # jq builds the JSON so a newline or quote in the notes cannot break it.
      jq -n --arg tag "$CI_COMMIT_TAG" --arg body "$NOTES" \
        '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: ($tag | test("-"))}' \
        > /tmp/release.json
    - |
      curl --fail-with-body -sS -X POST \
        -H "authorization: Bearer ${GITHUB_TOKEN}" \
        -H "accept: application/vnd.github+json" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
        -d @/tmp/release.json
