# The site is its own pnpm project, with its own lockfile, and not a member of
# the root workspace (site/README.md says why). This file is what makes pnpm
# treat site/ as a root of its own rather than as a part of the workspace above.

# Build scripts are denied by default in pnpm 11; each must be decided explicitly.
#
#   esbuild  Astro's bundler, through Vite. Its postinstall fetches the platform
#            binary, so it must run.
#   sharp    Astro's default image service. The site uses the passthrough image
#            service instead (astro.config.mjs), so the native build is not needed.
allowBuilds:
  esbuild: true
  sharp: false

# Transitive advisories the direct dependency has not yet picked up, pinned
# forward as in the root workspace. Drop each entry once astro resolves it.
overrides:
  # GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32, GHSA-x5rw-q4pp-hg5g. Reached through astro.
  devalue@<5.9.3: "^5.9.3"

# GHSA-ch52-4w7c-c8xp (http-cache-semantics max-stale) has no patched release:
# 4.2.0 is the latest published version and the advisory asks for 4.2.1. It is
# reached through astro at build time only; the site is served as static files,
# so no response cache runs. Ignored on 2026-10-03; remove this entry and update
# once 4.2.1 is published.
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
