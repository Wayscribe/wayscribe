# Demo profile. Adds the SQS-compatible queue and the demo services that prove
# the reference journey. Layer it over the core stack:
#
#   docker compose -f infrastructure/compose.yaml \
#                  -f infrastructure/compose.demo.yaml up --build
#
# Then:
#
#   pnpm demo:trigger
#
# ADR-015 keeps this file separate from compose.yaml so PostgreSQL remains the
# core stack's only required backing service.

name: wayscribe

x-demo: &demo
  # One image for the five demo services, named after the Compose project so two
  # checkouts started with different `-p` names do not build over each other's
  # image. The default keeps the old name where Compose does not provide it.
  image: ${COMPOSE_PROJECT_NAME:-wayscribe}-demo:local
  build:
    context: ..
    dockerfile: apps/demo/Dockerfile
  environment: &demo-env
    WAYSCRIBE_ENDPOINT: http://api:8080
    # A placeholder, and safe to commit: it authorises writing demo events to a
    # local stack and nothing else. Real keys come from `pnpm db:seed`, which
    # generates them and prints each one exactly once.
    WAYSCRIBE_API_KEY: ${DEMO_API_KEY:-wsk_demo0000000000000000000000000000}
    WAYSCRIBE_ENVIRONMENT: development
    QUEUE_ENDPOINT: http://elasticmq:9324
    QUEUE_URL: http://elasticmq:9324/000000000000/customer-updates
    DLQ_URL: http://elasticmq:9324/000000000000/customer-updates-dlq
    AWS_REGION: us-east-1
    DEMO_DATABASE_URL: postgresql://wayscribe:wayscribe@postgres:5432/demo
    TARGET_URL: http://demo-target:3300
    INTEGRATION_URL: http://demo-integration:3200

services:
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:9324:9324"

  # Runs once and exits. Everything after it can assume a migrated schema, a
  # registered API key, and a customer table.
  demo-bootstrap:
    <<: *demo
    # The keys come from these files, as for the API in compose.yaml, so the
    # demo key's verifier is written under the key the API treats as current.
    # ADMIN_TOKEN arrives from the same files and is not used here.
    env_file:
      - path: defaults.env
      - path: ../.env
        required: false
    environment:
      <<: *demo-env
      DATABASE_URL: postgresql://wayscribe:wayscribe@postgres:5432/wayscribe
      DEMO_DATABASE_NAME: demo
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-7}
    command: ["node", "apps/demo/dist/bootstrap.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  demo-target:
    <<: *demo
    command: ["node", "apps/demo/dist/target.js"]
    ports:
      - "127.0.0.1:3300:3300"

  demo-integration:
    <<: *demo
    command: ["node", "apps/demo/dist/integration.js"]
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      demo-bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_started
      elasticmq:
        condition: service_started

  demo-worker:
    <<: *demo
    command: ["node", "apps/demo/dist/worker.js"]
    depends_on:
      demo-bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_started
      elasticmq:
        condition: service_started
      demo-target:
        condition: service_started

  demo-source:
    <<: *demo
    command: ["node", "apps/demo/dist/source.js"]
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      demo-integration:
        condition: service_started
