# CI overlay for the demo acceptance test. Not for developer use.
#
# The other Compose files bind every published port to 127.0.0.1, which is the
# Compose half of ADR-016: a default `up` on a cloud host must not expose the
# stack to the internet.
#
# Under GitLab's docker-in-docker service, that loopback is the *dind
# container's* loopback, and the job running the test lives in a different
# container. The API, demo source and web health check ports are republished
# on all interfaces so the job can reach them at the `docker` host.

name: wayscribe

# `!override` rather than a plain list: Compose appends port lists across
# files, so without it each service kept its 127.0.0.1 binding and gained a
# 0.0.0.0 binding on the same host port, which Docker refuses to allocate.
services:
  api:
    ports: !override
      - "8080:8080"

  web:
    ports: !override
      - "3000:3000"

  demo-source:
    ports: !override
      - "3100:3100"
