# Read ENCRYPTION_KEY and ADMIN_TOKEN from files instead of the environment.
#
# With the plain Compose paths both are ordinary container environment
# variables, so anything that can run `docker inspect` or `docker compose config`
# on the host reads the key that decrypts every stored payload and the token that
# signs every admin session. That is the access `docker compose up` itself needs,
# so holding it is equivalent to holding the key (docs/SECURITY.md §5). Helm
# installs avoid it with `existingSecret`; this overlay is the Compose
# equivalent, using Docker's own secrets mechanism.
#
# Add it after the stack's own file, and name the files the values are in:
#
#   export COMPOSE_FILE=compose.published.yaml:compose.secret-files.yaml
#   export ENCRYPTION_KEY_PATH=/etc/wayscribe/encryption-key
#   export ADMIN_TOKEN_PATH=/etc/wayscribe/admin-token
#   docker compose up -d
#
# Each file holds the value and nothing else. Whitespace at the end is ignored,
# so a trailing newline is fine; an empty file is refused rather than read as an
# unset setting.
#
# `environment:` here overrides the stack's, so the plain variables arrive empty,
# which counts as unset. Setting one of them to a real value alongside its file
# is refused at startup, by name, because nothing on a running container would
# say which had won.
#
# During a key rotation, add ENCRYPTION_KEY_PREVIOUS_FILE the same way; the API
# and the CLI read it from a file too.

services:
  api:
    environment:
      ENCRYPTION_KEY: ""
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      ADMIN_TOKEN: ""
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets:
      - encryption_key
      - admin_token

  # The web app signs its sessions with the same token, so it reads it the same
  # way. It never reads the encryption key.
  web:
    environment:
      ADMIN_TOKEN: ""
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets:
      - admin_token

secrets:
  encryption_key:
    file: ${ENCRYPTION_KEY_PATH:?set ENCRYPTION_KEY_PATH to the file holding the encryption key}
  admin_token:
    file: ${ADMIN_TOKEN_PATH:?set ADMIN_TOKEN_PATH to the file holding the admin token}
