name: flight-recorder

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight
    ports:
      # Every published port binds to the loopback address, so a default `up` on a
      # cloud host does not expose the stack to the internet. This is the Compose
      # half of ADR-016.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Compose's project directory is `infrastructure/`, so the repository-root
    # .env is not picked up automatically. Without this, `cp .env.example .env`
    # appears to configure the stack and in fact does nothing, leaving it on the
    # committed development defaults below.
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://flight:flight@postgres:5432/flight
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8080
      PORT: "8080"
      LOG_LEVEL: info
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-for-local-development-0000}
      # Set only during a key rotation. Empty when unset, which the API reads as
      # no rotation in progress.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-replace-for-local-development-0000}
      DEFAULT_RETENTION_DAYS: "7"
      MAX_EVENT_PAYLOAD_BYTES: "262144"
      ALLOW_FULL_PAYLOAD_CAPTURE: "false"
      REPLAY_ALLOWED_HOSTS: localhost,host.docker.internal,demo-integration
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 first and
      # the server binds 0.0.0.0, so the IPv6 attempt is refused and the
      # container reports unhealthy forever while serving traffic perfectly.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Server-side only. The browser never contacts the API (ADR-029), so this
      # is the internal service name, not a host-reachable address.
      API_URL: http://api:8080
      # Must match the API's. The web app derives its session signing key from
      # this, so rotating it invalidates sessions on both sides at once.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-replace-for-local-development-0000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
