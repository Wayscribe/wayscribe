name: wayscribe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wayscribe
      POSTGRES_PASSWORD: wayscribe
      POSTGRES_DB: wayscribe
    ports:
      # Every published port binds to the loopback address, so a default `up` on a
      # cloud host does not expose the stack to the internet. This is the Compose
      # half of ADR-016.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayscribe -d wayscribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Compose's project directory is `infrastructure/`, so the repository-root
    # .env is not picked up automatically. Without this, `cp .env.example .env`
    # appears to configure the stack and in fact does nothing.
    #
    # The secrets come only from these files, never from `environment:` below.
    # A `${ENCRYPTION_KEY:-default}` there is interpolated from the shell or
    # `infrastructure/.env`, never from the root .env, and `environment:`
    # overrides `env_file:`, so the published default silently won over the
    # value the operator had set. The defaults file comes first so .env wins,
    # and ENCRYPTION_KEY_PREVIOUS reaches the API from .env during a rotation.
    env_file:
      - path: defaults.env
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://wayscribe:wayscribe@postgres:5432/wayscribe
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8080
      PORT: "8080"
      LOG_LEVEL: info
      DEFAULT_RETENTION_DAYS: "7"
      MAX_EVENT_PAYLOAD_BYTES: "262144"
      ALLOW_FULL_PAYLOAD_CAPTURE: "false"
      REPLAY_ALLOWED_HOSTS: localhost,host.docker.internal,demo-integration
    # DATABASE_STATEMENT_TIMEOUT_MS and METRICS_PORT are not set above, so the
    # root .env reaches the API for both (see .env.example). METRICS_PORT is
    # deliberately not published: add a loopback mapping in an override file
    # if a scraper on this host needs it (docs/OPERATIONS.md §13).
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 first and
      # the server binds 0.0.0.0, so the IPv6 attempt is refused and the
      # container reports unhealthy forever while serving traffic perfectly.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    # ADMIN_TOKEN comes from these, as for the API above, so the two always agree.
    # The files also carry ENCRYPTION_KEY and, during a rotation,
    # ENCRYPTION_KEY_PREVIOUS. The web app reads neither; they arrive only
    # because the files are shared.
    env_file:
      - path: defaults.env
      - path: ../.env
        required: false
    environment:
      # Server-side only. The browser never contacts the API (ADR-029), so this
      # is the internal service name, not a host-reachable address.
      API_URL: http://api:8080
      # Pinned because the root .env is loaded above and anything in it reaches
      # this container. A PORT meant for the API, such as the one .env.example
      # used to set, made Next listen on that port inside the container, and the
      # mapping below then reached nothing.
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
