# Run Wayscribe from published images, without cloning this repository.
#
#   curl -O https://gitlab.com/jojithedev/wayscribe/-/raw/main/infrastructure/compose.published.yaml
#
# Wayscribe stores everything in one PostgreSQL database, and expects you
# to bring your own: the one your team already backs up, monitors, and holds
# the credentials for. Point it at that, and name the release you are running:
#
#   export COMPOSE_FILE=compose.published.yaml
#   export WAYSCRIBE_VERSION=vX.Y.Z
#   export DATABASE_URL=postgresql://user:password@db.internal:5432/wayscribe
#   export ENCRYPTION_KEY=$(openssl rand -hex 32)
#   export ADMIN_TOKEN=$(openssl rand -hex 32)
#   docker compose up -d
#
# COMPOSE_FILE names the files every later `docker compose` command in the shell
# reads, so the one-off commands below see the same stack.
#
# WAYSCRIBE_VERSION is required, and names a release by its git tag, v
# included (releases are 0.x, so a tag looks like v0.1.0). There is no `latest`
# fallback on purpose: the migrate service applies the schema of whatever image
# it pulls, so an unpinned `docker compose pull` could move a database forward
# across a minor release, which before 1.0 may change the API, with no way
# back. Every command in the shell needs the variable, like COMPOSE_FILE.
#
# To try it without standing a database up first, add the bundled overlay to
# that list. It runs PostgreSQL in a container beside the rest and sets
# DATABASE_URL for you:
#
#   export COMPOSE_FILE=compose.published.yaml:compose.bundled.yaml
#   docker compose up -d
#
# A command without the overlay reports the PostgreSQL container as an orphan
# and suggests --remove-orphans, which would remove it. Keep COMPOSE_FILE set.
#
# Then open http://localhost:3000, and create the project you are going to
# instrument, since a new installation has none:
#
#   docker compose run --rm --entrypoint node api \
#     packages/database/dist/cli.js project:create acme "Acme Payments"
#   docker compose run --rm --entrypoint node api \
#     packages/database/dist/cli.js key:create acme production checkout-worker
#
# Then check the whole installation, with the key you were given:
#
#   docker compose run --rm --entrypoint node api \
#     packages/database/dist/cli.js doctor --api-url http://api:8080 --api-key <key>
#
# `compose.yaml` builds from source instead and is for people working on Flight
# Recorder itself.
#
# The API logs a warning at every boot while the published default secrets are
# in use. To rotate ENCRYPTION_KEY later, set the old value as
# ENCRYPTION_KEY_PREVIOUS while the new one takes over. See docs/OPERATIONS.md.

name: wayscribe

x-database: &database
  # Empty rather than required, so that `-f compose.bundled.yaml` can supply it.
  # Compose interpolates each file before merging them, so a `:?` here would
  # refuse to start even when the overlay is about to set the value.
  DATABASE_URL: ${DATABASE_URL:-}

services:
  # Runs once and exits. Applies migrations so the API is ready on first boot
  # rather than reporting migrations_pending until somebody reads the docs.
  #
  # It runs against your database, and it is the only thing here that writes
  # schema. If your team applies migrations through its own process, skip this
  # service and run the same command when you choose to.
  migrate:
    image: registry.gitlab.com/jojithedev/wayscribe/api:${WAYSCRIBE_VERSION:?set WAYSCRIBE_VERSION to the release tag to run, such as v0.1.0}
    environment: *database
    entrypoint: ["node", "packages/database/dist/cli.js", "migrate"]
    restart: "no"

  api:
    image: registry.gitlab.com/jojithedev/wayscribe/api:${WAYSCRIBE_VERSION:?set WAYSCRIBE_VERSION to the release tag to run, such as v0.1.0}
    environment:
      <<: *database
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8080
      PORT: "8080"
      LOG_LEVEL: info
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-for-local-development-0000}
      # Set only during a key rotation. Empty when unset, which the API reads as
      # no rotation in progress.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-replace-for-local-development-0000}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-7}
      MAX_EVENT_PAYLOAD_BYTES: "262144"
      ALLOW_FULL_PAYLOAD_CAPTURE: "false"
      # The hosts replay may send to, and the control that keeps replay from
      # being a request forgery tool: set the few development hosts you replay
      # to. `localhost` is this container. `host.docker.internal` would reach
      # every service on the Docker host, so it is not a default
      # (docs/OPERATIONS.md §9).
      REPLAY_ALLOWED_HOSTS: ${REPLAY_ALLOWED_HOSTS:-localhost}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      # How many reverse proxies in front of the API append to X-Forwarded-For.
      # 0 keys the admin authentication throttle on the socket address and
      # ignores the header (docs/OPERATIONS.md §9).
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      # Empty means no metrics listener. When set, /metrics is served on this
      # port inside the network and published nowhere; a scraper on the same
      # Compose network reaches it at api:<port> (docs/OPERATIONS.md §13).
      METRICS_PORT: ${METRICS_PORT:-}
    ports:
      # Loopback only: a `docker compose up` on a cloud host must not expose the
      # stack to the internet.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: registry.gitlab.com/jojithedev/wayscribe/web:${WAYSCRIBE_VERSION:?set WAYSCRIBE_VERSION to the release tag to run, such as v0.1.0}
    environment:
      # Server-side only. The browser never contacts the API, so this is the
      # internal service name rather than a host-reachable address.
      API_URL: http://api:8080
      # Must match the API's: the web app derives its session signing key from
      # this, so rotating it invalidates sessions on both sides at once.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-replace-for-local-development-0000}
      # The same setting for the login limiter (docs/OPERATIONS.md §9).
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
