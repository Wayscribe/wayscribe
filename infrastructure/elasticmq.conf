include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  customer-updates {
    # Seconds, not the minutes a production queue would use. DEMO_SCENARIO.md
    # section 6 shows 30- and 60-second gaps between retries, which are
    # realistic and useless for a demo somebody is watching: the whole journey
    # should finish in about ten seconds. The retries are real; the waiting is
    # compressed.
    defaultVisibilityTimeout = 3 seconds

    deadLettersQueue {
      name = "customer-updates-dlq"
      # One delivery and two retries, matching section 6's timeline.
      maxReceiveCount = 3
    }
  }

  customer-updates-dlq { }
}
